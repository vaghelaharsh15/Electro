{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Profile - Electro</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; margin: 0; font-family: 'Open Sans', sans-serif; }
        .profile-page { min-height: 100vh; display: flex; align-items: stretch; }
        .profile-left { flex: 0 0 42%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem; background: rgba(255,255,255,0.03); border-right: 1px solid rgba(255,255,255,0.1); }
        .profile-right { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 3rem 4rem; }
        .profile-pic-wrap { position: relative; width: 220px; height: 220px; border-radius: 50%; overflow: hidden; border: 5px solid #0d6efd; box-shadow: 0 0 30px rgba(13,110,253,0.4); background: #2a2a4a; }
        .profile-pic-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .profile-pic-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); font-size: 5rem; }
        .profile-pic-edit { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 10px; text-align: center; }
        .profile-pic-edit label { margin: 0; cursor: pointer; color: #fff; font-size: 0.9rem; display: block; }
        .profile-pic-edit input { display: none; }
        .profile-name-display { color: #fff; font-size: 1.5rem; font-weight: 700; margin-top: 1.5rem; }
        .profile-card { background: rgba(255,255,255,0.95); border-radius: 1.25rem; padding: 2.5rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .profile-card h3 { color: #0d6efd; font-weight: 700; margin-bottom: 1.75rem; padding-bottom: 0.75rem; border-bottom: 2px solid #0d6efd; }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.25); }
        .btn-primary { background: #0d6efd; border: none; padding: 0.6rem 1.5rem; font-weight: 600; }
        .btn-primary:hover { background: #0a58ca; }
        .profile-actions { margin-top: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
        @media (max-width: 991px) {
            .profile-page { flex-direction: column; }
            .profile-left { padding: 2rem 1rem; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
            .profile-right { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="profile-page">
        <div class="profile-left">
            <label for="profile-image-input" class="profile-pic-wrap" style="cursor: pointer;">
                {% if user.profile_image %}
                <img src="{{ user.profile_image.url }}" alt="Profile" id="profile-preview">
                {% else %}
                <div class="profile-pic-placeholder" id="profile-placeholder"><i class="fas fa-user"></i></div>
                <img src="" alt="" id="profile-preview" style="display:none;">
                {% endif %}
                <div class="profile-pic-edit">
                    <span class="mb-0"><i class="fas fa-camera me-2"></i>Change Photo</span>
                </div>
            </label>
            <div class="profile-name-display">{{ user.name }}</div>
        </div>
        <div class="profile-right">
            <div class="profile-card">
                <h3><i class="fas fa-user-edit me-2"></i>Edit Profile</h3>
                {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
                <form method="post" action="{% url 'profile' %}" enctype="multipart/form-data" id="profile-form">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Name</label>
                        <input type="text" class="form-control form-control-lg" id="name" name="name" value="{{ user.name }}" required placeholder="Your name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" value="{{ user.email }}" required placeholder="your@email.com">
                    </div>
                    <div class="mb-3">
                        <label for="phoneno" class="form-label fw-bold">Phone No</label>
                        <input type="text" class="form-control form-control-lg" id="phoneno" name="phoneno" value="{{ user.phoneno }}" required placeholder="Your phone number">
                    </div>
                    <input type="file" name="profile_image" id="profile-image-input" accept="image/*" class="d-none">
                    <div class="profile-actions">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save Changes</button>
                        <a href="{% url 'index' %}" class="btn btn-outline-secondary"><i class="fas fa-home me-2"></i>Back to Home</a>
                        <a href="{% url 'logout' %}" class="btn btn-outline-danger"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var input = document.getElementById('profile-image-input');
            if (!input) return;
            input.addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (file) {
                    var reader = new FileReader();
                    reader.onload = function(ev) {
                        var preview = document.getElementById('profile-preview');
                        var placeholder = document.getElementById('profile-placeholder');
                        if (preview) {
                            preview.src = ev.target.result;
                            preview.style.display = 'block';
                        }
                        if (placeholder) placeholder.style.display = 'none';
                    };
                    reader.readAsDataURL(file);
                }
            });
        })();
    </script>
</body>
</html>
